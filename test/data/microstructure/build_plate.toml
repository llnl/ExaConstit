# Microstructure generator example: an additively manufactured part on its build plate. Only the
# part (element attribute 1) gets grains; the plate (element attribute 2) is kept as one
# homogeneous grain with its own ExaConstit material region.
#
# Run with:
#     microstructure_generator -i build_plate.toml
# (the mesh named below is a placeholder: a mesh whose part elements have attribute 1 and whose
# plate elements have attribute 2).
# Every key not written here keeps its default (see src/microstructure/microstructure_options.hpp).

[Mesh]
    type = "file"
    floc = "part_on_plate.mesh"
    # Element attributes that receive grains (empty = every attribute not listed below)
    active_attributes = [1]
    # Element attribute -> ExaConstit region id. The plate becomes the last grain, with the
    # identity orientation, in region 2 (the grains of the part are region 1). A passthrough part
    # may also share a region with the grains (same material).
    passthrough_attributes = { "2" = 2 }

[Seeds]
    num_seeds = 200
    rng_seed = 1
    # Not allowed with passthrough attributes: boundary_clearance > 0 (the part/plate interface
    # would count as an outer boundary), and periodic axes

[Output]
    basename = "build_plate"
