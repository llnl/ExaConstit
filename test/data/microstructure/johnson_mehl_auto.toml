# Microstructure generator example: Johnson-Mehl nucleation and growth on a 10x10x10 auto hex box.
#
# Run with:
#     microstructure_generator -i johnson_mehl_auto.toml
# Every key not written here keeps its default (see src/microstructure/microstructure_options.hpp).
#
# Nuclei appear at random places and times, at a constant rate per unit volume and time, and
# grow as spheres at a constant speed; a nucleus born inside an already grown grain is discarded.
# Each point of the part belongs to the grain that reaches it first, so grain boundaries are
# curved (hyperboloids) and early nuclei grow into larger grains. In infinite space the expected
# number of grains per unit volume is about 0.896 (rate / growth_speed)^(3/4), i.e. about 19 here.

[Mesh]
    type = "auto"
    [Mesh.Auto]
        length = [1.0, 1.0, 1.0]
        ncuts = [10, 10, 10]

[Seeds]
    placement = "johnson_mehl"
    rng_seed = 5
    [Seeds.JohnsonMehl]
        # Nuclei per unit volume per unit time (time units are arbitrary but consistent).
        rate = 60.0
        # Growth speed, length per unit time.
        growth_speed = 1.0
        # 0 = keep nucleating until the part is fully transformed (the classical microstructure).
        end_time = 0.0
        # 0 = no limit on the number of nuclei.
        num_nuclei = 0

[Tessellation]
    # Johnson-Mehl grains are the cells of the additive metric |x - s_i| - a_i with
    # a_i = -growth_speed x birth time (required for this placement).
    metric = "additive"

[Output]
    basename = "johnson_mehl_auto"
