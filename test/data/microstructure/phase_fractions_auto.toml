# Microstructure generator example: a synthetic two-phase microstructure. Random Voronoi grains
# are given phases so that the phase volume fractions approach the requested ones; every phase
# becomes one ExaConstit material region.
#
# Run with:
#     microstructure_generator -i phase_fractions_auto.toml
# Every key not written here keeps its default (see src/microstructure/microstructure_options.hpp).

[Mesh]
    type = "auto"
    [Mesh.Auto]
        length = [1.0, 1.0, 1.0]
        ncuts = [10, 10, 10]

[Seeds]
    num_seeds = 40
    rng_seed = 8

[Regions]
    # Grains are visited in a random order (keyed by rng_seed and their ids) and each is given
    # the phase that is furthest below its target volume. The achieved fractions are within
    # (largest grain volume) / (material volume) of the targets.
    mode = "phase_fractions"
    phases = [{id = 1, fraction = 0.6}, {id = 2, fraction = 0.4}]
    # Phase 2 is not crystalline (e.g. an amorphous second phase): its grains get the identity
    # orientation and its region is flagged non-crystalline
    non_crystalline_phases = [2]

[Output]
    basename = "phase_fractions_auto"
