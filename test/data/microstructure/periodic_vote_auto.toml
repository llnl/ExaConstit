# Microstructure generator example: a periodic RVE. 16 Voronoi grains on a 12x12x12 auto hex box
# that wrap around all three box faces, labeled by a volume-weighted vote inside each element.
#
# Run with:
#     microstructure_generator -i periodic_vote_auto.toml
# Every key not written here keeps its default (see src/microstructure/microstructure_options.hpp).
#
# A periodic microstructure repeats the box in every periodic direction, like the unit cell of a
# crystal: a grain cut by the face x = 0 continues on the face x = 1. Use it with periodic
# boundary conditions. The generator makes shifted copies ("images") of every seed so the grains
# match across opposite faces, and the fragment cleanup treats matching faces on opposite box
# planes as connected, so a grain that wraps around the box stays one grain.

[Mesh]
    type = "auto"
    [Mesh.Auto]
        length = [1.0, 1.0, 1.0]
        ncuts = [12, 12, 12]

[Seeds]
    num_seeds = 16
    rng_seed = 7
    # Random sequential adsorption: no two seeds closer than 0.5 (V/N)^(1/3). Distances are
    # measured across the periodic faces too (to the nearest periodic copy).
    min_distance_factor = 0.5

[Tessellation]
    metric = "voronoi"
    # Wrap-around per direction [x, y, z].
    periodic = [true, true, true]
    # Each element goes to the grain that owns most of its volume, estimated from 8^vote_levels
    # points inside the element (vote_levels 0-3; 2 = 64 points). More accurate grain volumes
    # than labeling by the centroid alone, at a higher cost.
    sampling = "quadrature_vote"
    vote_levels = 2

[Cleanup]
    # Split every extra piece of a grain into a new grain (the default "auto" would merge tiny
    # pieces instead).
    fragments = "split"

[Output]
    basename = "periodic_vote_auto"
    # Grain pairs touching across a periodic box face count as neighbors too (in the grain
    # table's num_neighbors and in this adjacency table). Grain centroids in the grain table are
    # not unwrapped: a grain that wraps around the box gets the plain average of its elements.
    grain_adjacency = true
