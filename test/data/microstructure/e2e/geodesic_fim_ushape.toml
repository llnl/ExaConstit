# Generator input of the Stage 1e end-to-end test "geodesic distance (FIM) on the U-shaped part".
#
# Hand-written, not generated. The CTest chain in test/microstructure/test_tool_stage1e.cmake runs
#     microstructure_generator -i test/data/microstructure/e2e/geodesic_fim_ushape.toml
#                              -m test/data/microstructure/u_shape_hex.mesh
# (paths shown relative to the repository root; CTest passes absolute paths) at 1 and at 2 MPI
# ranks, checks that both runs write byte-identical files, runs mechanics on the 2-rank result at
# 1 and at 2 ranks (decks test/data/microstructure/mechanics/ms_geodesic_fim_ushape_np{1,2}.toml)
# and compares the two mechanics results.
#
# What it exercises: the same 8 seeds as e2e/connected_ushape.toml, but the distance from a seed
# is the length of the shortest path inside the material, computed on the mesh vertices by the
# Fast Iterative Method (an eikonal solver: distances spread outward from the seeds one layer of
# elements per sweep, using straight-line paths across each element's faces). Grains therefore
# grow around the notch instead of across it, with curved boundaries near its corners. Two seeds
# fall in the notch (outside the material) and start from their nearest element. Elements are
# labeled by a volume-weighted vote of 8^2 points each. Measured: 9 distance and 9 label rounds,
# no unreached element, 8 final grains (one small extra piece merged by the cleanup).

[Mesh]
    type = "file"
    # Overridden by -m in the test (relative paths are relative to the working directory)
    floc = "u_shape_hex.mesh"

[Seeds]
    num_seeds = 8
    rng_seed = 75
    placement = "rejection"
    sampling_domain = "bbox"

[Tessellation]
    metric = "voronoi"
    distance = "geodesic"
    geodesic = { solver = "fim" }
    sampling = "quadrature_vote"
    vote_levels = 2

[Output]
    basename = "e2e_geodesic_fim_ushape"
    mesh_format = "serial"
    # Plain text, so the 1-rank and 2-rank mesh files can be compared byte for byte
    compression = 0
    grain_adjacency = true
    paraview = false
