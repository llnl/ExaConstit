# Generator options for the Stage 2 end-to-end test "conformal" (test/CMakeLists.txt): the 8
# Voronoi grains of voronoi_auto.toml on the 8x8x8 auto box, with the grain boundaries fitted
# ([Conformal] enabled = true). The mesh file carries the moved nodes; grain_file = "auto" writes
# no grain file after a fit (an auto box rebuilt by ExaConstit would lose the moved nodes), so
# mechanics reads the mesh file (mechanics/ms_conformal_file_np1.toml).
[Mesh]
    type = "auto"
    [Mesh.Auto]
        length = [1.0, 1.0, 1.0]
        ncuts = [8, 8, 8]
[Seeds]
    num_seeds = 8
    rng_seed = 0
    placement = "rejection"
[Tessellation]
    metric = "voronoi"
    sampling = "centroid"
[Conformal]
    enabled = true
[Output]
    basename = "conformal_auto"
    mesh_format = "serial"
