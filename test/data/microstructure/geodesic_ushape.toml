# Microstructure generator example: "geodesic" distance on a U-shaped part.
#
# Run with (from this directory):
#     microstructure_generator -i geodesic_ushape.toml
# Every key not written here keeps its default (see src/microstructure/microstructure_options.hpp).
#
# The part is [0,3] x [0,2] x [0,1] without the notch [1,2] x [1,2] x [0,1] (u_shape_hex.mesh). With
# "geodesic" distance the distance from a seed is the length of the shortest path that stays inside
# the material, so grains grow around the notch instead of across it, as they would in a lattice
# strut or a bracket. Grain boundaries are then curved where paths bend around corners.
#
# Geodesic distance needs metric = "voronoi" or "additive" without anisotropy (Laguerre and Quadric
# values are not path lengths). Not allowed: periodic axes, fit_volumes,
# lloyd_iterations / centroidal_power, voxel maps.

[Mesh]
    type = "file"
    floc = "u_shape_hex.mesh"

[Seeds]
    num_seeds = 12
    rng_seed = 7

[Tessellation]
    metric = "voronoi"
    distance = "geodesic"
    # Path-length solver: "fim" (default) = Fast Iterative Method eikonal solver, accurate;
    # "graph" = shortest paths along element edges and diagonals (fast, but distances are
    # over-estimated by up to ~12% on hex meshes; grain boundaries move much less).
    geodesic = { solver = "fim" }
    # Label each element by a volume-weighted vote of 8^2 points instead of its centroid
    sampling = "quadrature_vote"
    vote_levels = 2

[Output]
    basename = "geodesic_ushape"
