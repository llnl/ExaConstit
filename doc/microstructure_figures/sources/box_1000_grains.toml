# 1000 equiaxed Voronoi grains in a unit cube meshed with 100^3 hexahedra (about 1000 elements
# per grain). Figure: doc/microstructure_figures/box_1000_staircase.jpg.
# box_1000_grains_conformal.toml is the same with the grain boundaries fitted.
[Mesh]
    type = "auto"
    [Mesh.Auto]
        length = [1.0, 1.0, 1.0]
        ncuts = [100, 100, 100]

[Seeds]
    num_seeds = 1000
    rng_seed = 1
    min_distance_factor = 0.5

[Tessellation]
    metric = "voronoi"

[Output]
    basename = "box_1000"
    paraview = true
